<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Gilded Ace · local frame check</title></head>
<body><div id="root"></div><output id="cinema-frame-report" hidden></output>
<script>
// Local QA entry only: Vite's production build includes index.html, not this page.
// Observe actual frame intervals without patching application or browser clocks.
const report = document.getElementById('cinema-frame-report');
let run = null, last = null, previous = null, runs = [], longTasks = [];
const observer = typeof PerformanceObserver === 'function' ? new PerformanceObserver(list => {
  for (const entry of list.getEntries()) longTasks.push({start:entry.startTime,duration:entry.duration});
}) : null;
try { observer?.observe({type:'longtask',buffered:true}); } catch {}
function summary(samples) {
  const sorted = samples.map(s=>s.ms).sort((a,b)=>a-b);
  return {frames:sorted.length,medianMs:sorted[Math.floor(sorted.length*.5)]||0,p95Ms:sorted[Math.floor(sorted.length*.95)]||0,maxMs:sorted.at(-1)||0,over33:sorted.filter(v=>v>33.4).length,over50:sorted.filter(v=>v>50).length};
}
function tick(now) {
  const intro = document.querySelector('.cinema-opening');
  const active = intro && intro.dataset.paused!=='true' && !document.hidden;
  if (intro && intro!==previous) { run={start:now,samples:[],viewport:[innerWidth,innerHeight]}; last=null; previous=intro; }
  if (active && run) {
    if (last!==null) run.samples.push({ms:now-last,phase:intro.dataset.phase});
    last=now;
  } else last=null;
  if (!intro && run) {
    const result={...summary(run.samples),viewport:run.viewport,elapsedMs:now-run.start,phases:{},longTasks:longTasks.filter(e=>e.start>=run.start&&e.start<=now)};
    for (const phase of ['deal','ace','zoom','reveal']) result.phases[phase]=summary(run.samples.filter(s=>s.phase===phase));
    runs.push(result); report.textContent=JSON.stringify(runs); run=null; previous=null;
  }
  requestAnimationFrame(tick);
}
requestAnimationFrame(tick);
</script><script type="module" src="/src/main.tsx"></script></body></html>
